<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>マニラの野菜・魚介・肉価格</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="vendor/chart.umd.min.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main>
    <nav id="categories" role="tablist" aria-label="品目の分類"></nav>
    <label class="field-label" for="item">品目</label>
    <select id="item" aria-label="品目"></select>
    <div id="periods" role="group" aria-label="表示期間">
      <button type="button" data-period="1">1年</button>
      <button type="button" data-period="3">3年</button>
      <button type="button" data-period="all" aria-pressed="true">全期間</button>
    </div>
    <div id="plot">
      <p id="empty" hidden>この期間のデータはありません</p>
      <canvas id="chart" role="img" aria-label="価格の推移"></canvas>
    </div>
    <div id="legend" aria-label="グラフの凡例"></div>
    <dl id="stats"></dl>
    <div id="notes">
      <p>首都圏の公設市場（農業省の調査対象）の平均です。店や日によって値段は違います。</p>
      <p id="midpoint-note" hidden>破線の期間（2023〜2024年ごろ）は、安値と高値の中間の値です。</p>
      <p id="own-note" hidden>◆は著者がカルティマール市場で買ったときの値段です。</p>
    </div>
    <p id="source"></p>
  </main>
</body>
</html>
